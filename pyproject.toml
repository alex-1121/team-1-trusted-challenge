[project]
name = "pets-transformer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas"]

[project.optional-dependencies]
semantic = ["numpy", "sentence-transformers>=3.0"]
train = ["scikit-learn>=1.4", "Faker==40.44.0", "openai>=1.40", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pets_transformer.semantic" = ["models/head.npz", "models/meta.json"]

[tool.pytest.ini_options]
# Our tests only. The organisers' own tests in data/proving-ground/tests (gitignored) are not collected, so the
# count is the same on every clone, with or without the data.
testpaths = ["tests"]
